swagger: "2.0"
info:
  title: API
  version: "5.0"
  description: DOCs API

tags:
  - name: "1. Autenticação"
    description: Endpoints de login e autenticação
  - name: "2. Usuário"
    description: Endpoints de cadastro e consulta de usuários
  - name: "3. Comanda"
    description: Endpoints de comandas e produtos

host: localhost:8080
basePath: /RestAPIFurb
schemes:
  - http

securityDefinitions:
  BearerAuth:
    type: apiKey
    name: Authorization
    in: header
    description: Insira seu token JWT no formato **Bearer &lt;seu_token&gt;**

paths:
  /usuarios:
    post:
      summary: Cria um novo usuário
      tags: ["2. Usuário"]
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: "#/definitions/UsuarioInput"
      responses:
        201:
          description: Usuário cadastrado com sucesso!
          schema:
            $ref: "#/definitions/SuccessMessage"
        400:
          description: Dados obrigatórios ausentes
          schema:
            $ref: "#/definitions/Error"
        409:
          description: Nome de usuário já cadastrado
          schema:
            $ref: "#/definitions/Error"
    get:
      summary: Lista todos os usuários
      tags: ["2. Usuário"]
      responses:
        200:
          description: Lista de usuários
          schema:
            type: array
            items:
              $ref: "#/definitions/Usuario"
    delete:
      summary: Remove todos os usuários
      tags: ["2. Usuário"]
      responses:
        200:
          description: Todos os usuários foram removidos
          schema:
            $ref: "#/definitions/SuccessMessage"

  /usuarios/{id}:
    get:
      summary: Busca usuário por ID
      tags: ["2. Usuário"]
      parameters:
        - in: path
          name: id
          type: integer
          required: true
          description: ID do usuário
      responses:
        200:
          description: Dados do usuário encontrado
          schema:
            $ref: "#/definitions/Usuario"
        404:
          description: Usuário não encontrado
          schema:
            $ref: "#/definitions/Error"
    delete:
      summary: Remove usuário por ID
      tags: ["2. Usuário"]
      parameters:
        - in: path
          name: id
          type: integer
          required: true
          description: ID do usuário
      responses:
        200:
          description: Usuário removido com sucesso
          schema:
            $ref: "#/definitions/SuccessMessage"
        404:
          description: Usuário não encontrado
          schema:
            $ref: "#/definitions/Error"

  /login:
    post:
      summary: Realiza login e retorna um token JWT
      tags: ["1. Autenticação"]
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: "#/definitions/LoginInput"
      responses:
        200:
          description: Login realizado com sucesso
          schema:
            $ref: "#/definitions/Token"
        400:
          description: Dados obrigatórios ausentes
          schema:
            $ref: "#/definitions/Error"
        401:
          description: Nome ou senha inválidos
          schema:
            $ref: "#/definitions/Error"

  /comandas:
    post:
      summary: Cria uma nova comanda com produtos juntos
      tags: ["3. Comanda"]
      security:
        - BearerAuth: []
      parameters:
        - in: body
          name: body
          required: true
          schema:
            $ref: "#/definitions/ComandaInput"
      responses:
        201:
          description: Comanda criada com produtos
          schema:
            $ref: "#/definitions/Comanda"
        400:
          description: Dados obrigatórios ausentes ou inválidos
          schema:
            $ref: "#/definitions/Error"
        404:
          description: Usuário não encontrado
          schema:
            $ref: "#/definitions/Error"
    get:
      summary: Lista todas as comandas
      tags: ["3. Comanda"]
      responses:
        200:
          description: Lista de comandas
          schema:
            type: array
            items:
              $ref: "#/definitions/ComandaUsuario"

  /comandas/{id}:
    put:
      summary: Atualiza produtos da comanda (JWT)
      tags: ["3. Comanda"]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          type: integer
          required: true
          description: ID da comanda
        - in: body
          name: body
          required: true
          schema:
            $ref: "#/definitions/ComandaProdutosInput"
      responses:
        200:
          description: Comanda atualizada
          schema:
            $ref: "#/definitions/Comanda"
        400:
          description: Dados não fornecidos ou inválidos
          schema:
            $ref: "#/definitions/Error"
        404:
          description: Comanda não encontrada
          schema:
            $ref: "#/definitions/Error"
    get:
      summary: Busca uma comanda por ID (usuário + produtos)
      tags: ["3. Comanda"]
      parameters:
        - in: path
          name: id
          type: integer
          required: true
          description: ID da comanda
      responses:
        200:
          description: Dados da comanda
          schema:
            $ref: "#/definitions/Comanda"
        404:
          description: Comanda não encontrada
          schema:
            $ref: "#/definitions/Error"
    delete:
      summary: Remove uma comanda por ID
      tags: ["3. Comanda"]
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          type: integer
          required: true
          description: ID da comanda
      responses:
        200:
          description: Comanda removida
          schema:
            $ref: "#/definitions/Success"
        404:
          description: Comanda não encontrada
          schema:
            $ref: "#/definitions/Error"

definitions:
  UsuarioInput:
    type: object
    required:
      - nome
      - telefone
      - senha
    properties:
      nome:
        type: string
        example: joao
      telefone:
        type: string
        example: "478888888"
      senha:
        type: string
        example: "123"

  Usuario:
    type: object
    properties:
      id:
        type: integer
        example: 1
      nome:
        type: string
        example: joao
      telefone:
        type: string
        example: "478888888"

  ComandaInput:
    type: object
    required:
      - idUsuario
      - produtos
    properties:
      idUsuario:
        type: integer
        example: 1
      produtos:
        type: array
        items:
          type: object
          properties:
            nome:
              type: string
              example: X-Salada
            preco:
              type: number
              example: 30

  ComandaProdutosInput:
    type: object
    required:
      - produtos
    properties:
      produtos:
        type: array
        items:
          type: object
          properties:
            id:
              type: integer
              example: 1
            nome:
              type: string
              example: X-Salada
            preco:
              type: number
              example: 30

  ComandaUsuario:
    type: object
    properties:
      idUsuario:
        type: integer
        example: 1
      nomeUsuario:
        type: string
        example: joao
      telefoneUsuario:
        type: string
        example: "478888888"

  Comanda:
    type: object
    properties:
      idUsuario:
        type: integer
        example: 1
      nomeUsuario:
        type: string
        example: joao
      telefoneUsuario:
        type: string
        example: "478888888"
      produtos:
        type: array
        items:
          type: object
          properties:
            id:
              type: integer
              example: 1
            nome:
              type: string
              example: X-Salada
            preco:
              type: number
              example: 30

  LoginInput:
    type: object
    required:
      - nome
      - senha
    properties:
      nome:
        type: string
        example: joao
      senha:
        type: string
        example: "123"

  Token:
    type: object
    properties:
      token:
        type: string
        example: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
      mensagem:
        type: string
        example: Login realizado com sucesso!

  SuccessMessage:
    type: object
    properties:
      mensagem:
        type: string
        example: Operação realizada com sucesso!

  Success:
    type: object
    properties:
      success:
        type: object
        properties:
          text:
            type: string
            example: comanda removida

  Error:
    type: object
    properties:
      erro:
        type: string
        example: Mensagem de erro

